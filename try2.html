```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Impact Cards</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        :root {

            --space-unit: 1em;
            --space-md: calc(1.25 * var(--space-unit));

            --primary-color: #f5e6d0;
            --accent-color: #ffc107;

            --text-color: #333333;
            --bg-secondary: #2a2a2a;

            --highlight-color: #ffc107;

            --dark-bg: #0f0f0f;
            --darker-bg: #050505;

            --text-light: #ffffff;
            --text-muted: #b0b0b0;

            --border-color: #333;
            --bg-primary: #1a1a1a;

        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: var(--dark-bg);
            font-family: system-ui, -apple-system, sans-serif;
            padding: 80px 20px;
            color: var(--text-light);

        }

        /* GRID */

        .impact-grid {

            max-width: 1100px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 28px;

        }

        /* CARD */

        .impact-card {

            background: var(--bg-primary);
            border: 1px solid var(--border-color);

            border-radius: 14px;

            padding: 30px;

            display: flex;
            flex-direction: column;
            gap: 16px;

            transition: .35s ease;

            position: relative;

        }

        /* HOVER */

        .impact-card:hover {

            transform: translateY(-8px);

            border-color: var(--accent-color);

            box-shadow: 0 10px 40px rgba(255, 193, 7, 0.15);

        }

        /* ICON */

        .impact-icon {

            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: rgba(255, 193, 7, 0.1);

            font-size: 22px;

            color: var(--accent-color);

        }

        /* TITLE */

        .impact-title {

            font-size: 18px;
            font-weight: 600;

        }

        /* DESC */

        .impact-desc {

            font-size: 14px;
            line-height: 1.7;

            color: var(--text-muted);

        }

        /* ACCENT LINE */

        .impact-line {

            width: 40px;
            height: 3px;

            background: var(--accent-color);

            border-radius: 6px;

        }
    </style>
</head>

<body>



</body>

</html>
